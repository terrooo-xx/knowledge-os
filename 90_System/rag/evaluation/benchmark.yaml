# Knowledge OS RAG Query Benchmark 数据集
#
# 用途：RAG Evaluation / Query Benchmark 的输入。每条查询会在真实生产检索链
# （Wiki-first → Quality Gate → RAW fallback → Reranker → Evidence → Judge）上执行，
# 用于度量当前检索质量，而不是作为"ground truth"评判系统。
#
# 字段说明：
#   id               唯一查询标识
#   query            真实查询语句（中文）
#   category         知识领域（用于 By Domain 统计）
#   project          关联项目（可选）
#   query_type       fact | configuration | procedure | troubleshooting |
#                    comparison | concept | cross_document | unknown
#   difficulty       easy | medium | hard
#   expected_source  wiki | wiki_or_raw | raw | either | unknown
#                    （预期最合理的命中来源；不是强制 ground truth）
#   expected_answerable true | false | unknown
#                    （人工/启发式预期系统是否可回答；unknown=无法确认）
#   expected         标注来源：heuristic（基于现有知识面的启发式判断）|
#                    manual（人工标注，见 golden.yaml）| unknown
#   notes            备注（可选）
#
# 注意：expected_* 只是参照，不假装是 ground truth。最终以真实执行结果为准。

