# Knowledge OS RAG 配置
# 路径均为相对 Vault 根目录的路径

paths:
  inbox: "00_Inbox"
  wiki: "20_Wiki"
  projects: "30_Projects"
  raw_vector_db: "90_System/rag/database/raw_vector_db"
  wiki_vector_db: "90_System/rag/database/wiki_vector_db"
  main_vector_db: "90_System/rag/database/main_vector_db"
  knowledge_gaps: "90_System/rag/tests/knowledge_gaps.yaml"
  cache: "90_System/rag/cache"

chunking:
  size: 800
  overlap: 100

embedding:
  provider: bge
  model: BAAI/bge-small-zh-v1.5
  api_key_env: OPENAI_API_KEY

store:
  provider: local

retrieval:
  wiki_first: true
  # wiki 命中但证据/Judge 不足时，回退到 RAW（经 BGE Reranker）补充/替换；不降低任何阈值
  wiki_fallback_on_insufficient: true
  confidence_threshold: 0.78
  top_k: 5
  dense_weight: 0.6
  bm25_weight: 0.4

inbox:
  similarity_threshold: 0.82
  update_threshold: 0.65

evidence_judge:
  enabled: true
  top_k: 5

# Evidence Context Expansion（邻接 Chunk 扩展为完整语义窗口）
# prev_chunks/next_chunks: 命中 chunk 前后扩展的邻接 chunk 数
# max_evidence_chars: 单个 Evidence Window 最大字符数（整 chunk 保留，不句中硬切）
# use_for_answer: 是否让 LLM Answer 直接消费扩展窗口（默认否，保持 Judge/Answer 行为不变）
evidence_window:
  enabled: true
  prev_chunks: 1
  next_chunks: 1
  max_evidence_chars: 3000
  use_for_answer: false

reranker:
  enabled: true
  provider: bge
  model: "BAAI/bge-reranker-v2-m3"  # portable default; machine-local override in config.local.yaml
  top_k: 5

llm:
  provider: deepseek
  model:
    name: deepseek-chat
  api_key_env: DEEPSEEK_API_KEY
  timeout: 30
  api:
    base_url: https://api.deepseek.com
  temperature: 0.2
  template: "90_System/rag/prompts/rag_answer.md"

wiki:
  default_domain: "01_计算机基础"
  status: draft
# Review Preflight（自动 LLM Judge 预处理）
# max_per_run: 每轮 preflight 最多 Judge 的候选数（避免单次请求无限调用 LLM）
# judge_timeout_seconds: 判定“judging 中”记录超时的秒数（进程异常后可接管重跑）
# failed_retry_minutes: Judge 失败记录在该时间后允许自动重试
review_preflight:
  enabled: true
  max_per_run: 8
  judge_timeout_seconds: 180
  failed_retry_minutes: 15
  # staleness_hours: Control Center 提示“数据不新鲜”的阈值（仅提示，不自动触发 LLM）
  staleness_hours: 24
  # schedule_minutes: 仅用于 register_review_preflight_task.ps1 注册 Windows 定时任务
  schedule_minutes: 30

# 周期性复盘（Weekly Review）
# weekday: monday..sunday（ISO 周中英文）；time 为本地 24 小时制
# stale_threshold_days：超过该天数未更新的 Wiki 标记为“复查风险”，非“已过期”
weekly_review:
  enabled: true
  weekday: friday
  time: "18:00"
  stale_threshold_days: 90

