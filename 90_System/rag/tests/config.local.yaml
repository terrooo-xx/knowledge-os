paths:
  inbox: "90_System/rag/tests/fixtures"
  wiki: "20_Wiki"
  raw_vector_db: "90_System/rag/database/test_raw_vector_db"
  wiki_vector_db: "90_System/rag/database/test_wiki_vector_db"
  cache: "90_System/rag/cache"

embedding:
  provider: bge
  model: BAAI/bge-small-zh-v1.5
  api_key_env: OPENAI_API_KEY

store:
  provider: local

retrieval:
  wiki_first: true
  confidence_threshold: 0.78
  top_k: 5
  dense_weight: 0.6
  bm25_weight: 0.4

reranker:
  enabled: true
  provider: bge
  model: "C:/Users/陶权煜/.cache/modelscope/models/BAAI--bge-reranker-v2-m3/snapshots/master"
  top_k: 5

llm:
  provider: deepseek
  model:
    name: deepseek-chat
  api_key_env: DEEPSEEK_API_KEY
  api:
    base_url: https://api.deepseek.com
  temperature: 0.2
  template: "90_System/prompts/rag_answer.md"

wiki:
  default_domain: "01_计算机基础"
  status: draft
