<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Knowledge OS Control Center</title>
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; font-family: "Microsoft YaHei", system-ui, sans-serif; background: #f4f6f8; color: #222;
    display: flex; flex-direction: column; overflow: hidden; }
  header { flex: 0 0 auto; background: #1f2937; color: #fff; padding: 12px 20px; }
  header .row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  header h1 { font-size: 18px; margin: 0; }
  header .sub { color: #9ca3af; font-size: 12px; }
  .statusbar { display: flex; gap: 18px; flex-wrap: wrap; margin-top: 8px; font-size: 12px; color: #d1d5db; }
  .statusbar b { color: #fbbf24; font-weight: 600; }
  .btn { border: 1px solid #cbd5e1; background: #fff; padding: 4px 12px; border-radius: 6px; cursor: pointer; font-size: 13px; margin-right: 6px; }
  .btn:hover { background: #f3f4f6; }
  .btn.sync { border-color: #2563eb; color: #1d4ed8; }
  .btn.review { border-color: #7c3aed; color: #6d28d9; }
  .btn.approve { border-color: #16a34a; color: #15803d; }
  .btn.reject { border-color: #dc2626; color: #b91c1c; }
  .btn.resolve { border-color: #2563eb; color: #1d4ed8; }
  .btn.ignore { border-color: #6b7280; color: #4b5563; }
  .layout { flex: 1 1 auto; min-height: 0; display: flex; }
  nav { flex: 0 0 170px; width: 170px; background: #fff; border-right: 1px solid #e5e7eb; padding: 12px 0; overflow-y: auto; }
  nav button { display: block; width: 100%; border: none; background: none; text-align: left; padding: 10px 18px; font-size: 14px; cursor: pointer; color: #374151; }
  nav button:hover { background: #f3f4f6; }
  nav button.active { background: #e0e7ff; color: #1d4ed8; font-weight: 600; }
  main { flex: 1 1 auto; min-width: 0; min-height: 0; padding: 20px; overflow-y: auto; overflow-x: auto; }
  main::after { content: ''; display: block; height: 28px; }
  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; margin-bottom: 16px; }
  .card { background: #fff; border: 1px solid #e5e7eb; border-radius: 8px; padding: 14px; }
  .card .num { font-size: 28px; font-weight: 700; }
  .card .label { font-size: 12px; color: #6b7280; }
  table { width: 100%; border-collapse: collapse; background: #fff; font-size: 13px; }
  th, td { border: 1px solid #e5e7eb; padding: 7px 10px; text-align: left; vertical-align: top; }
  th { background: #f9fafb; }
  .badge { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 12px; }
  .b-draft { background: #fef3c7; color: #92400e; }
  .b-reviewed { background: #dbeafe; color: #1e40af; }
  .b-stable { background: #d1fae5; color: #065f46; }
  .b-pending { background: #fee2e2; color: #991b1b; }
  .b-resolved { background: #d1fae5; color: #065f46; }
  .b-planning { background: #e0e7ff; color: #3730a3; }
  .b-active { background: #d1fae5; color: #065f46; }
  .b-blocked { background: #fee2e2; color: #991b1b; }
  .b-ok { background: #d1fae5; color: #065f46; }
  .b-warning { background: #fef3c7; color: #92400e; }
  .b-error { background: #fee2e2; color: #991b1b; }
  .msg { padding: 6px 10px; border-radius: 6px; margin: 6px 0; font-size: 13px; }
  .msg.ok { background: #dcfce7; color: #166534; }
  .msg.err { background: #fee2e2; color: #991b1b; }
  pre { white-space: pre-wrap; background: #111827; color: #e5e7eb; padding: 10px; border-radius: 6px; font-size: 12px; max-height: 300px; overflow: auto; }
  details { margin: 6px 0; }
  summary { cursor: pointer; font-weight: 600; }
  a { color: #1d4ed8; }
  .ctx-pre { background: #f3f4f6; color: #374151; max-height: 220px; overflow: auto; white-space: pre-wrap; border: 1px solid #e5e7eb; padding: 10px; border-radius: 6px; font-size: 12px; }
  .ctx-scroll { background: #f9fafb; color: #222; max-height: 360px; overflow: auto; white-space: pre-wrap; border: 1px solid #e5e7eb; padding: 10px; border-radius: 6px; font-size: 13px; }
  .card-sub { font-size: 12px; color: #6b7280; margin-top: 4px; }
  .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 12px; }
  @media (max-width: 900px) { .two-col { grid-template-columns: 1fr; } }
  .hbar-row { display: flex; align-items: center; gap: 8px; margin: 7px 0; }
  .hbar-label { width: 108px; font-size: 12px; color: #374151; text-align: right; flex: none; }
  .hbar-track { flex: 1; background: #f3f4f6; border-radius: 4px; height: 16px; overflow: hidden; display: flex; }
  .hbar-seg { height: 100%; }
  .hbar-val { width: 48px; font-size: 12px; color: #374151; text-align: right; flex: none; }
  .attention-item { display: flex; align-items: center; gap: 8px; margin: 6px 0; font-size: 13px; flex-wrap: wrap; }
  /* ---- Guide（使用指南）---- */
  .g-layout { display: flex; gap: 16px; align-items: flex-start; }
  .g-toc { width: 250px; flex-shrink: 0; background: #fff; border: 1px solid #e5e7eb; border-radius: 8px; padding: 12px; position: sticky; top: 12px; max-height: calc(100vh - 150px); overflow: auto; }
  .g-toc input { width: 100%; padding: 6px 8px; border: 1px solid #cbd5e1; border-radius: 6px; margin-bottom: 8px; font-size: 13px; box-sizing: border-box; }
  .g-toc a { display: block; padding: 4px 8px; border-radius: 6px; color: #374151; text-decoration: none; font-size: 13px; cursor: pointer; }
  .g-toc a:hover { background: #eef2ff; }
  .g-toc a.active { background: #e0e7ff; color: #1d4ed8; font-weight: 600; }
  .g-body { flex: 1; min-width: 0; }
  .g-status { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; margin-bottom: 12px; }
  .g-stat { background: #fff; border: 1px solid #e5e7eb; border-radius: 8px; padding: 10px 12px; }
  .g-stat .n { font-size: 20px; font-weight: 700; }
  .g-stat .l { font-size: 11px; color: #6b7280; }
  .g-reco { background: #eff6ff; border: 1px solid #bfdbfe; border-radius: 8px; padding: 10px 14px; margin-bottom: 14px; font-size: 14px; }
  .g-section { background: #fff; border: 1px solid #e5e7eb; border-radius: 8px; padding: 16px; margin-bottom: 14px; scroll-margin-top: 12px; }
  .g-section h3 { margin-top: 0; }
  .g-entry { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 10px; }
  .g-entry button { text-align: left; background: #f9fafb; border: 1px solid #e5e7eb; border-radius: 8px; padding: 12px; cursor: pointer; font-size: 14px; }
  .g-entry button:hover { background: #eef2ff; border-color: #bfdbfe; }
  .g-flow { display: flex; flex-direction: column; align-items: center; gap: 4px; margin: 8px 0; }
  .g-flow-row { display: flex; justify-content: center; gap: 24px; flex-wrap: wrap; }
  .g-box { background: #f0fdf4; border: 1px solid #86efac; color: #14532d; border-radius: 8px; padding: 8px 14px; font-size: 13px; text-align: center; }
  .g-box.gray { background: #f3f4f6; border-color: #d1d5db; color: #374151; }
  .g-box.blue { background: #eff6ff; border-color: #93c5fd; color: #1e40af; }
  .g-box.amber { background: #fffbeb; border-color: #fcd34d; color: #92400e; }
  .g-box.red { background: #fef2f2; border-color: #fca5a5; color: #991b1b; }
  .g-arrow { color: #9ca3af; font-size: 16px; line-height: 1; }
  .g-prevnext { display: flex; justify-content: space-between; gap: 10px; margin-top: 4px; }
  .g-prevnext button { flex: 1; }
  .g-step { display: flex; gap: 8px; align-items: flex-start; margin: 4px 0; }
  .g-step .idx { flex-shrink: 0; width: 22px; height: 22px; border-radius: 50%; background: #1d4ed8; color: #fff; text-align: center; line-height: 22px; font-size: 12px; }
  .g-tag { display: inline-block; font-size: 11px; padding: 1px 8px; border-radius: 10px; margin-left: 6px; }
  .g-tag.auto { background: #dcfce7; color: #166534; }
  .g-tag.human { background: #fef3c7; color: #92400e; }
  .g-tag.read { background: #e0e7ff; color: #3730a3; }
  .g-header { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; flex-wrap: wrap; }
  .g-toc-toggle { display: none; }
  .g-search-wrap { position: relative; flex: 1; max-width: 340px; }
  .g-search-wrap input { width: 100%; padding: 7px 10px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 13px; box-sizing: border-box; }
  #g_results { position: absolute; top: 100%; left: 0; right: 0; background: #fff; border: 1px solid #e5e7eb; border-radius: 8px; box-shadow: 0 4px 12px rgba(0,0,0,.08); z-index: 60; max-height: 300px; overflow: auto; }
  .g-result { padding: 8px 10px; cursor: pointer; font-size: 13px; border-bottom: 1px solid #f3f4f6; }
  .g-result:hover { background: #eef2ff; }
  .g-toc-head { font-size: 14px; padding: 4px 8px 8px; color: #111827; font-weight: 700; }
  .g-toc a.g-parent { font-weight: 600; }
  .g-toc a.g-child { padding-left: 26px; font-size: 12px; }
  .g-crumb { color: #6b7280; font-size: 12px; margin: 2px 0 10px; }
  .g-crumb b { color: #111827; }
  @media (max-width: 900px) {
    .g-toc-toggle { display: inline-block; }
    .g-layout { flex-direction: column; }
    .g-toc { display: none; position: fixed; left: 0; top: 0; bottom: 0; width: 260px; max-height: none; z-index: 80; border-radius: 0; box-shadow: 0 0 16px rgba(0,0,0,.18); overflow: auto; }
    .g-toc.open { display: block; }
    .g-search-wrap { max-width: none; }
  }
</style>
</head>
<body>
<header>
  <div class="row">
    <h1>Knowledge OS Control Center</h1>
    <span class="sub">Human-in-the-Loop 管理 · 本地 localhost</span>
    <span style="flex:1"></span>
    <button class="btn sync" onclick="syncNow()">🔄 同步知识库</button>
    <button class="btn review" onclick="generateReview()">📝 生成本周复盘</button>
  </div>
  <div class="statusbar" id="statusbar">加载状态中…</div>
  <div id="flash" style="margin-top:6px"></div>
</header>
<div class="layout">
  <nav>
    <button data-view="dashboard" class="active">仪表盘</button>
    <button data-view="guide">📖 使用指南</button>
    <button data-view="todo">AI 待办</button>
    <button data-view="wikis">Wiki Review</button>
    <button data-view="gaps">知识缺口</button>
    <button data-view="sources">来源</button>
    <button data-view="activity">活动</button>
    <button data-view="weekly_review">每周复盘</button>
    <button data-view="projects">项目状态</button>
    <button data-view="health">系统健康</button>
    <button data-view="query_trace">检索 Trace</button>
    <button data-view="rag_evaluation">RAG Evaluation</button>
  </nav>
  <main id="main"></main>
</div>
<script>
const $main = document.getElementById('main');
const views = ['dashboard','guide','todo','wikis','gaps','sources','activity','weekly_review','projects','health','query_trace','rag_evaluation'];
document.querySelectorAll('nav button').forEach(b => b.addEventListener('click', () => {
  views.forEach(v => document.querySelector('nav button[data-view="'+v+'"]').classList.remove('active'));
  b.classList.add('active');
  try { history.replaceState(null, '', '#'+b.dataset.view); } catch (e) {}
  render(b.dataset.view);
}));
async function api(path, opts) { const r = await fetch(path, opts); return r.json(); }
function esc(s) { return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function badge(s) { return '<span class="badge b-'+esc(s)+'">'+esc(s)+'</span>'; }
function msg(ok, text) { return '<div class="msg '+(ok?'ok':'err')+'">'+esc(text)+'</div>'; }
function flash(ok, text) { document.getElementById('flash').innerHTML = msg(ok, text); }
async function postAction(actionId, decision) {
  const r = await api('/api/actions/'+encodeURIComponent(actionId)+'/'+decision, {
    method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({actor:'user'})
  });
  flash(r.ok, r.message || (r.ok ? '成功' : '失败'));
  return r;
}
function actionButtons(a) {
  const map = {approve:'批准', reject:'拒绝', resolve:'解决', ignore:'忽略', reprocess:'重新处理'};
  return a.available_actions.map(d => '<button class="btn '+d+'" onclick="postAction(\''+esc(a.id)+'\',\''+d+'\')">'+(map[d]||d)+'</button>').join('');
}
async function loadStatus() {
  try {
    const s = await api('/api/status');
    const fmt = (v) => v ? esc(v) : '—';
    const gv = s.governance || {};
    const gvColor = gv.required ? '#d97706' : (gv.status==='regressed'||gv.status==='failed' ? '#b91c1c' : '#16a34a');
    document.getElementById('statusbar').innerHTML =
      '<span>最近同步：<b>'+fmt(s.last_sync)+'</b></span>' +
      '<span>最近每周复盘：<b>'+fmt(s.last_review)+'</b></span>' +
      '<span>下次每周复盘：<b>'+fmt(s.next_review)+'</b></span>' +
      '<span>治理：<b style="color:'+gvColor+'">'+esc(gv.status||'idle')+'</b>'+(gv.required?' ⚠ 待验证':'')+'</span>';
  } catch (e) {
    document.getElementById('statusbar').innerHTML = '<span>状态加载失败：'+esc(String(e))+'</span>';
  }
}
async function syncNow() {
  flash(true, '同步中…');
  try {
    const r = await api('/api/sync', {method:'POST'});
    if (r.success) {
      flash(true, '同步完成：新增 '+r.added+' / 修改 '+r.modified+' / 删除 '+r.deleted+' / 索引 '+r.indexed+'，最后同步 '+r.last_sync);
    } else {
      flash(false, '同步失败：' + (r.error || r.message || '未知错误'));
    }
    await loadStatus(); render('dashboard');
  } catch (e) {
    flash(false, '同步请求失败：'+esc(String(e)));
  }
}
async function generateReview() {
  flash(true, '正在生成本周复盘…');
  try {
    const r = await api('/api/weekly_review/generate', {method:'POST'});
    if (r.success) {
      flash(true, '已生成：' + (r.message || 'ok'));
    } else {
      flash(false, '生成失败：' + (r.error || r.message || '未知错误'));
    }
    await loadStatus(); render('dashboard');
  } catch (e) {
    flash(false, '生成请求失败：'+esc(String(e)));
  }
}
function reportLink(rel) {
  if (!rel) return '—';
  const abs = '/D:/KnowledgeBase/Obsidian%20Vault/' + rel.split('/').map(encodeURIComponent).join('/');
  const uri = 'obsidian://open?path=' + encodeURIComponent('D:/KnowledgeBase/Obsidian Vault/' + rel);
  return '<a href="'+uri+'" target="_blank">打开 ' + esc(rel) + '</a>';
}
let lastView = 'dashboard';
function traceRow(k, v) { return '<tr><th style="width:180px;background:#f9fafb">'+esc(k)+'</th><td>'+v+'</td></tr>'; }
async function runQueryTrace() {
  const q = (document.getElementById('qt_query') || {}).value || '';
  const el = document.getElementById('qt_result');
  if (!q.trim()) { el.innerHTML = msg(false, '请输入查询'); return; }
  el.innerHTML = msg(true, '正在执行真实检索链（含模型加载，可能较慢）…');
  try {
    const r = await api('/api/query/trace', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({query:q})});
    if (!r.ok) { el.innerHTML = msg(false, r.message || '查询失败'); return; }
    el.innerHTML = renderTrace(r.result || {});
  } catch (e) { el.innerHTML = msg(false, '请求失败：'+esc(String(e))); }
}
function renderTrace(res) {
  const t = res.retrieval_trace || {};
  const tr = t.retrieval || {}, cand = t.candidates || {}, rank = t.ranking || {};
  const ev = t.evidence || {}, j = t.judge || {}, ans = t.answer || {};
  const windows = res.evidence_windows || [];
  let html = '';
  if (t.summary) html += '<div class="card" style="margin-bottom:12px"><div style="font-size:14px"><b>决策链摘要：</b>'+esc(t.summary)+'</div></div>';
  html += '<div class="card" style="margin-bottom:12px"><h3 style="margin-top:0">检索决策 Retrieval Trace</h3><table style="font-size:13px">' +
    traceRow('路径 Path', esc(tr.path || '—')) +
    traceRow('初始路径', esc(tr.initial_path || '—')) +
    traceRow('Wiki 置信度', tr.wiki_confidence != null ? esc(tr.wiki_confidence) : '—') +
    traceRow('阈值 Threshold', tr.wiki_threshold != null ? esc(tr.wiki_threshold) : '—') +
    traceRow('Wiki 门槛', tr.gate_passed ? '✓ 通过' : '✗ 未通过') +
    traceRow('回退 Fallback', tr.fallback_used ? '✓ 已回退' : '否') +
    traceRow('回退原因', esc(tr.fallback_reason || '—')) +
    traceRow('候选数', 'Wiki '+esc(cand.wiki_count ?? 0)+' · RAW '+esc(cand.raw_count ?? 0)) +
    traceRow('Reranker', rank.reranker_used ? ('✓ 已使用 '+esc(rank.reranker||'')) : ('未使用（'+esc(rank.reranker_reason||'')+'）')) +
    traceRow('Evidence 窗口', esc(ev.window_count != null ? ev.window_count : '—')) +
    traceRow('Evidence 充分', ev.sufficient ? '是' : '否') +
    traceRow('Judge', j.executed ? (j.result==='passed' ? '✓ 通过' : '✗ '+esc(j.result)) : '未执行') +
    traceRow('最终状态', esc(ans.status || '—')) +
    '</table></div>';
  if (windows.length) {
    html += '<div class="card" style="margin-bottom:12px"><h3 style="margin-top:0">Evidence Windows（'+windows.length+'）</h3>' +
      windows.map((w,i) => '<details style="margin:4px 0"><summary>Window '+(i+1)+' · '+esc(w.source||'')+' · 命中 Chunk '+esc((w.hit_chunk_ids||[]).join(','))+'（上下文 '+esc(w.context_start_chunk)+'→'+esc(w.context_end_chunk)+'）</summary>' +
        '<div style="font-size:12px;color:#6b7280">Retrieval '+esc(w.retrieval_score)+' · Rerank '+esc(w.rerank_score==null?'—（未重排）':w.rerank_score)+'</div>' +
        '<pre class="ctx-pre">'+esc(w.text||'')+'</pre></details>').join('') + '</div>';
  }
  html += '<div style="color:#6b7280;font-size:12px;margin-top:6px">Trace 数据来自本次真实查询执行（不重复检索 / 重排 / Judge）；仅展示结构化状态，不暴露模型推理过程。</div>';
  return html;
}

function pct(v) { return v == null ? 'N/A' : esc(v)+'%'; }
const VIEW_LABELS = {dashboard:'仪表盘', guide:'使用指南', todo:'AI 待办', wikis:'Wiki Review', gaps:'知识缺口', sources:'来源', activity:'活动', weekly_review:'每周复盘', projects:'项目状态', health:'系统健康', query_trace:'检索 Trace', rag_evaluation:'RAG Evaluation'};
function viewLabel(v) { return VIEW_LABELS[v] || v; }

// ================= 使用指南（Guide / 操作说明）=================
// Docs-style：左侧固定目录 + 右侧只渲染当前章节；#guide = 首页，#guide/<slug> = 章节。
// 只读：仅渲染 + 跳转真实功能；系统状态全部来自 API，不硬编码。
const GUIDE_META = { version: '1.1', updated: '2026-08-18' };
const GUIDE_SECTIONS = [
  {id:'getting-started', title:'1. 开始使用', slug:'getting-started', html: `
    <h3>什么是 Control Center？</h3>
    <p>Knowledge OS Control Center 是知识库的运营控制台：导入资料、审核 Wiki、核验 Source、处理知识缺口、查看 RAG 质量、验证 Governance / Baseline、查看每周复盘都在这里完成。</p>
    <h3>如何使用本指南</h3>
    <div class="g-step"><div class="idx">1</div><div>左侧目录：点击章节，右侧只显示该章节内容（当前项高亮）</div></div>
    <div class="g-step"><div class="idx">2</div><div>顶部搜索：搜索章节标题与内容，点击结果直接进入对应章节</div></div>
    <div class="g-step"><div class="idx">3</div><div>面包屑：显示当前位置（使用指南 / 父章节 / 子章节）</div></div>
    <div class="g-step"><div class="idx">4</div><div>底部「上一章 / 下一章」：按文档顺序切换章节</div></div>
    <div class="g-step"><div class="idx">5</div><div>URL 形如 #guide/wiki-review：可刷新保持、可深链、浏览器后退/前进正常</div></div>
    <div style="color:#6b7280;font-size:12px">指南版本：${esc(GUIDE_META.version)} · 更新：${esc(GUIDE_META.updated)}</div>`},
  {id:'workflow', title:'2. 整体流程', slug:'workflow', html: `
    <h3>Knowledge OS 整体流程（Source → Wiki → Governance）</h3>
    <div class="g-flow">
      <div class="g-box gray">📥 00_Inbox（放入原始资料）</div><div class="g-arrow">↓</div>

function guideSearchResults(q) {
  q = (q || '').trim().toLowerCase();
  if (!q) return [];
  // 排序：标题命中优先，其次内容命中次数（高频更相关）
  return GUIDE_FLAT.map(x => {
    const title = (x.title + ' ' + (guideParent(x) ? guideParent(x).title : '')).toLowerCase();
    const text = guideText(x.html);
    const titleHit = title.includes(q);
    const idx = text.indexOf(q);
    const headHit = idx >= 0 && idx < 80;      // 查询词出现在章节开头（核心主题）
    const count = text.split(q).length - 1;
    return { x: x, titleHit: titleHit, headHit: headHit, count: count };
  }).filter(r => r.titleHit || r.count > 0)
    // 标题命中 -> 章节开头命中 -> 命中次数 -> 子章节（具体页面）优先
    .sort((a, b) => (b.titleHit - a.titleHit) || (b.headHit - a.headHit)
          || (b.count - a.count) || ((b.x.parentId ? 1 : 0) - (a.x.parentId ? 1 : 0)))
    .slice(0, 12)
    .map(r => r.x);
}

function guidePrevNext(sec) {
  const idx = GUIDE_FLAT.findIndex(x => x.slug === sec.slug);

function trendChart(series) {
  const periods = (series[0] && series[0].values || []).map(v => v.period);
  if (!periods.length) return '<div style="color:#9ca3af;font-size:12px">无趋势数据。</div>';
  const allVals = [];
  series.forEach(s => s.values.forEach(v => { if (v.value != null) allVals.push(v.value); }));
  const max = Math.max(1, Math.max.apply(null, allVals.concat([1])));
  const W = 340, H = 120, padL = 26, padB = 16;
  const groupW = (W - padL) / periods.length;
  const barW = Math.max(4, Math.min(16, (groupW - 6) / series.length));
  let svg = '<svg width="'+W+'" height="'+H+'" style="max-width:100%;height:auto">';
  for (let i = 0; i <= 3; i++) {
    const y = padB + (H - padB) * (1 - i / 3);
    svg += '<line x1="'+padL+'" y1="'+y+'" x2="'+W+'" y2="'+y+'" stroke="#e5e7eb" stroke-width="1"></line>';
    svg += '<text x="'+(padL-4)+'" y="'+(y+3)+'" text-anchor="end" font-size="9" fill="#9ca3af">'+Math.round(max*i/3)+'</text>';
  }
  periods.forEach((p, pi) => {
    series.forEach((s, si) => {
      const v = s.values[pi];
      if (!v || v.value == null) return;
      const h = Math.max(1, (v.value / max) * (H - padB - 8));
      const x = padL + pi * groupW + 4 + si * barW;
      const y = H - padB - h;
      svg += '<rect x="'+x+'" y="'+y+'" width="'+barW+'" height="'+h+'" fill="'+s.color+'" rx="1"><title>'+esc(p)+'\n'+esc(s.name)+': '+esc(v.value)+(v.baseline ? ' (baseline)' : '')+'</title></rect>';
    });
    svg += '<text x="'+(padL + pi*groupW + groupW/2)+'" y="'+(H-4)+'" text-anchor="middle" font-size="9" fill="#6b7280">'+esc(p.slice(-3))+'</text>';
  });
  svg += '</svg><div style="margin-top:4px">'+series.map(s => '<span style="font-size:11px;color:#374151;margin-right:10px"><span style="display:inline-block;width:10px;height:10px;background:'+s.color+';margin-right:4px;border-radius:2px"></span>'+esc(s.name)+'</span>').join('')+'</div>';
  return svg;
}

async function viewAction(actionId) {

function renderCtx(ctx) {

async function postActionCtx(actionId, decision) {
  const r = await api('/api/actions/'+encodeURIComponent(actionId)+'/'+decision, {
    method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({actor:'user'})
  });
  const el = document.getElementById('ctxflash');
  if (el) el.innerHTML = msg(r.ok, r.message || (r.ok ? '成功' : '失败'));

    if (ctx2 && ctx2.ok) renderCtx(ctx2);

function ctxJudge(j, actionId) {

function listBlock(label, items) {
  if (!items || !items.length) return '';
  return '<details style="margin:4px 0"><summary>'+esc(label)+'（'+items.length+'）</summary>' +
    items.map(i => '<div class="msg" style="margin:3px 0">'+esc(i)+'</div>').join('') + '</details>';

async function runJudge(actionId) {
  const el = document.getElementById('ctxflash');
  if (el) el.innerHTML = msg(true, 'AI 审核运行中（DeepSeek）…');
  try {
    const r = await api('/api/actions/'+encodeURIComponent(actionId)+'/judge', {
      method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({actor:'user'})
    });
    if (el) el.innerHTML = msg(r.ok, r.ok ? 'AI 审核完成' : (r.message || '运行失败'));
    const ctx2 = await api('/api/actions/'+encodeURIComponent(actionId)+'/context');
    if (ctx2 && ctx2.ok) renderCtx(ctx2);
    else if (el) el.innerHTML = msg(false, (ctx2 && ctx2.message) || '上下文刷新失败');
  } catch (e) {
    if (el) el.innerHTML = msg(false, 'AI 审核请求失败：'+esc(String(e)));
  }
}
function ctxEvidence(ev) {
  const srcs = ev.sources || [], chunks = ev.chunks || [];
  if (!srcs.length) return '<h3>③ 依据 Evidence</h3><div class="card" style="margin-bottom:12px">无来源记录。</div>';
  let html = '<h3>③ 依据 Evidence（来源 '+srcs.length+'）</h3>';
  html += srcs.map(s => {
    const sChunks = chunks.filter(c => c.source === s.path);
    const roleTxt = s.role === 'related_wiki' ? '（相关 Wiki）' : s.role === 'related_source' ? '（相关来源）' : '';
    let inner = '<div style="font-size:11px;color:#9ca3af;word-break:break-all" title="'+esc(s.path)+'">'+esc(s.path)+'</div>';
    if (s.readable) inner += '<div style="margin:2px 0"><a href="'+obsUri(s.path)+'" target="_blank">打开来源</a></div>';
    if (!s.readable) {
      inner += '<div class="msg err" style="margin:4px 0">'+esc(s.error || '不可读')+'</div>';
    } else if (!sChunks.length) {
      inner += '<div class="msg" style="margin:4px 0">无可展示的 chunk。</div>';
    } else {
      inner += sChunks.map(c =>
        '<details style="margin:4px 0"><summary>Chunk #'+(c.position+1)+(c.score != null ? ' · score '+Number(c.score).toFixed(3) : '')+'</summary>' +
        '<pre class="ctx-pre">'+esc(c.content)+'</pre></details>').join('');
      if (s.truncated) inner += '<div style="color:#6b7280;font-size:12px">仅展示前 '+sChunks.length+' 段（共 '+s.chunk_count+' 段），完整内容请打开来源。</div>';
      if (s.window_text && s.chunk_count > 1) {
        inner += '<details style="margin:4px 0"><summary>完整语义上下文（Chunk '+esc(s.window_start ?? 1)+' → '+esc(s.window_end ?? s.chunk_count)+'，去重叠拼接）</summary><pre class="ctx-pre">'+esc(s.window_text)+'</pre></details>';
      }
    }
    return '<div class="card" style="margin-bottom:10px"><div><b>'+esc(s.name)+'</b>'+roleTxt+' <span style="color:#6b7280;font-size:12px">'+esc(s.type)+' · '+(s.readable ? (s.chunk_count+' 段') : '不可读')+'</span></div>' + inner + '</div>';
  }).join('');
  return html;
}

    if (sug && sug.changes && sug.changes.length && j.recommendation === 'approve') {
      html += '<div style="margin:6px 0"><b>如批准将执行：</b></div>' +
        sug.changes.map(c => '<div style="font-size:13px;margin:2px 0">'+esc(c.target)+'：<span class="badge b-draft">'+esc(c.before)+'</span> → <span class="badge b-reviewed">'+esc(c.after)+'</span></div>').join('');
    }
    return html + '</div>';
  }
  if (!sug || (!sug.action && !sug.summary && !(sug.changes || []).length)) return '';
  let html = '<h3>⑤ AI 建议（规则）</h3><div class="card" style="margin-bottom:12px">';
  if (sug.action) html += kv('建议操作', badge(sug.action));
  if (sug.summary) html += '<div style="margin:4px 0">'+esc(sug.summary)+'</div>';
  if (sug.changes && sug.changes.length) {
    html += '<div style="margin:6px 0"><b>变更预览（人工确认后才执行）：</b></div>' +
      sug.changes.map(c => '<div style="font-size:13px;margin:2px 0">'+esc(c.target)+'：<span class="badge b-draft">'+esc(c.before)+'</span> → <span class="badge b-reviewed">'+esc(c.after)+'</span></div>').join('');
  }
  if (sug.conflict && sug.conflict.length) html += '<div style="margin:6px 0"><b>冲突：</b>'+sug.conflict.map(esc).join('；')+'</div>';
  return html + '</div>';
}
function updSel() { document.getElementById('selcount').textContent = document.querySelectorAll('.wsel:checked').length; }
async function batchApprove() {
  const ids = Array.from(document.querySelectorAll('.wsel:checked')).map(x => 'wiki_review:' + x.value);
  if (!ids.length) { alert('未选择任何 Wiki'); return; }
  if (!confirm('确认批准选中的 ' + ids.length + ' 项（draft -> reviewed）？')) return;
  const r = await api('/api/actions/batch/approve', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ids:ids, confirm:true, actor:'user'})});
  flash(r.ok, r.message || (r.ok ? '完成' : '失败'));
  render('wikis');
}
function routeFromHash() {
  const h = location.hash.replace('#','') || 'dashboard';
  if (h === 'guide' || h.startsWith('guide/')) {
    views.forEach(v => { const b = document.querySelector('nav button[data-view="'+v+'"]'); if (b) b.classList.remove('active'); });
    const gb = document.querySelector('nav button[data-view="guide"]');
    if (gb) gb.classList.add('active');
    render('guide');
    return;
  }
  gotoView(h);
}
window.addEventListener('hashchange', routeFromHash);
loadStatus();
routeFromHash();
</script>
