<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Knowledge OS Control Center</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: "Microsoft YaHei", system-ui, sans-serif; background: #f4f6f8; color: #222; }
  header { background: #1f2937; color: #fff; padding: 12px 20px; display: flex; align-items: center; gap: 12px; }
  header h1 { font-size: 18px; margin: 0; }
  header .sub { color: #9ca3af; font-size: 12px; }
  .layout { display: flex; min-height: calc(100vh - 52px); }
  nav { width: 170px; background: #fff; border-right: 1px solid #e5e7eb; padding: 12px 0; }
  nav button { display: block; width: 100%; border: none; background: none; text-align: left; padding: 10px 18px; font-size: 14px; cursor: pointer; color: #374151; }
  nav button:hover { background: #f3f4f6; }
  nav button.active { background: #e0e7ff; color: #1d4ed8; font-weight: 600; }
  main { flex: 1; padding: 20px; overflow: auto; }
  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; margin-bottom: 16px; }
  .card { background: #fff; border: 1px solid #e5e7eb; border-radius: 8px; padding: 14px; }
  .card .num { font-size: 28px; font-weight: 700; }
  .card .label { font-size: 12px; color: #6b7280; }
  table { width: 100%; border-collapse: collapse; background: #fff; font-size: 13px; }
  th, td { border: 1px solid #e5e7eb; padding: 7px 10px; text-align: left; vertical-align: top; }
  th { background: #f9fafb; }
  .badge { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 12px; }
  .b-draft { background: #fef3c7; color: #92400e; }
  .b-reviewed { background: #dbeafe; color: #1e40af; }
  .b-stable { background: #d1fae5; color: #065f46; }
  .b-pending { background: #fee2e2; color: #991b1b; }
  .b-resolved { background: #d1fae5; color: #065f46; }
  .btn { border: 1px solid #cbd5e1; background: #fff; padding: 4px 12px; border-radius: 6px; cursor: pointer; font-size: 13px; margin-right: 6px; }
  .btn:hover { background: #f3f4f6; }
  .btn.approve { border-color: #16a34a; color: #15803d; }
  .btn.reject { border-color: #dc2626; color: #b91c1c; }
  .btn.resolve { border-color: #2563eb; color: #1d4ed8; }
  .btn.ignore { border-color: #6b7280; color: #4b5563; }
  .msg { padding: 6px 10px; border-radius: 6px; margin: 6px 0; font-size: 13px; }
  .msg.ok { background: #dcfce7; color: #166534; }
  .msg.err { background: #fee2e2; color: #991b1b; }
  pre { white-space: pre-wrap; background: #111827; color: #e5e7eb; padding: 10px; border-radius: 6px; font-size: 12px; max-height: 300px; overflow: auto; }
  details { margin: 6px 0; }
  summary { cursor: pointer; font-weight: 600; }
</style>
</head>
<body>
<header>
  <h1>Knowledge OS Control Center</h1>
  <span class="sub">Human-in-the-Loop 管理 · 本地 localhost</span>
</header>
<div class="layout">
  <nav>
    <button data-view="dashboard" class="active">仪表盘</button>
    <button data-view="todo">AI 待办</button>
    <button data-view="wikis">Wiki Review</button>
    <button data-view="gaps">知识缺口</button>
    <button data-view="sources">Source</button>
    <button data-view="activity">操作记录</button>
    <button data-view="health">系统健康</button>
  </nav>
  <main id="main"></main>
</div>
<script>
const $main = document.getElementById('main');
const views = ['dashboard','todo','wikis','gaps','sources','activity','health'];
document.querySelectorAll('nav button').forEach(b => b.addEventListener('click', () => {
  views.forEach(v => document.querySelector('nav button[data-view="'+v+'"]').classList.remove('active'));
  b.classList.add('active'); render(b.dataset.view);
}));
async function api(path, opts) { const r = await fetch(path, opts); return r.json(); }
function esc(s) { return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function badge(s) { return '<span class="badge b-'+esc(s)+'">'+esc(s)+'</span>'; }
function msg(ok, text) { return '<div class="msg '+(ok?'ok':'err')+'">'+esc(text)+'</div>'; }
async function postAction(actionId, decision) {
  const r = await api('/api/actions/'+encodeURIComponent(actionId)+'/'+decision, {
    method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({actor:'user'})
  });
  if (window._flash) window._flash(r.ok, r.message || (r.ok ? '成功' : '失败'));
  return r;
}
function actionButtons(a) {
  const map = {approve:'批准', reject:'拒绝', resolve:'解决', ignore:'忽略', reprocess:'重新处理'};
  return a.available_actions.map(d => '<button class="btn '+d+'" onclick="postAction(\''+esc(a.id)+'\',\''+d+'\')">'+(map[d]||d)+'</button>').join('');
}
async function render(view) {
  if (view === 'dashboard') {
    const d = await api('/api/dashboard');
    const st = d.wiki_status || {};
    $main.innerHTML = '<h2>仪表盘</h2><div class="cards">' +
      '<div class="card"><div class="num">'+d.wiki_total+'</div><div class="label">Wiki 总数</div></div>' +
      '<div class="card"><div class="num">'+(st.draft||0)+'</div><div class="label">draft（待审核）</div></div>' +
      '<div class="card"><div class="num">'+(st.reviewed||0)+'</div><div class="label">reviewed</div></div>' +
      '<div class="card"><div class="num">'+(st.stable||0)+'</div><div class="label">stable</div></div>' +
      '<div class="card"><div class="num">'+d.gaps_pending+'</div><div class="label">Gap pending</div></div>' +
      '<div class="card"><div class="num">'+d.actions_pending+'</div><div class="label">AI 待办</div></div>' +
      '<div class="card"><div class="num">'+d.inbox_files+'</div><div class="label">Inbox 待处理文件</div></div>' +
      '</div><h3>最近活动</h3>'+activityTable(d.recent_activity);
  } else if (view === 'todo') {
    const actions = await api('/api/actions');
    const pending = actions.filter(a => a.status === 'pending');
    $main.innerHTML = '<h2>AI 待办（'+pending.length+'）</h2>' + pending.map(a =>
      '<div class="card" style="margin-bottom:10px">' +
      '<div><b>'+(a.type==='wiki_review'?'⚠ Wiki 需要审核':'⚠ Knowledge Gap')+'</b>' +
      (a.type==='wiki_review' ? ' &nbsp; '+esc(a.target.title)+' <span style="color:#6b7280">('+esc(a.target.domain)+')</span>'
                              : ' &nbsp; “'+esc(a.target.question)+'”') + '</div>' +
      '<div style="color:#6b7280;font-size:13px;margin:4px 0">AI 建议：<b>'+esc(a.ai_recommendation)+'</b></div>' +
      '<div style="color:#6b7280;font-size:12px">'+esc(a.reason)+'</div>' +
      '<div style="margin-top:6px">'+actionButtons(a)+'<button class="btn" onclick="viewAction(\''+esc(a.id)+'\')">查看上下文</button></div>' +
      '</div>').join('') || '<p>暂无待办。</p>';
  } else if (view === 'wikis') {
    const wikis = await api('/api/wikis');
    $main.innerHTML = '<h2>Wiki 审核</h2>' +
      '<div style="margin:8px 0">已选 <b id="selcount">0</b> 项（仅 draft）&nbsp;' +
      '<button class="btn approve" onclick="batchApprove()">确认批准选中项</button></div>' +
      '<table><tr><th></th><th>Wiki</th><th>状态</th><th>领域</th><th>来源</th><th>长度</th><th>操作</th></tr>' +
      wikis.map(w => '<tr><td>'+(w.status==='draft' ? '<input type="checkbox" class="wsel" value="'+esc(w.path)+'" onchange="updSel()">' : '')+'</td>' +
        '<td>'+esc(w.path)+'</td><td>'+badge(w.status)+'</td><td>'+esc(w.domain)+'</td><td>'+esc((w.sources||[]).join('；'))+'</td><td>'+w.len+'</td>' +
        '<td>'+(w.status==='draft' ? '<button class="btn" onclick="viewAction(\'wiki_review:'+esc(w.path)+'\')">详情</button>' : '')+'</td></tr>').join('') + '</table>';
  } else if (view === 'gaps') {
    const gaps = await api('/api/gaps');
    $main.innerHTML = '<h2>知识缺口（'+gaps.length+'）</h2><table><tr><th>问题</th><th>类型</th><th>状态</th><th>发现时间</th><th>AI 建议</th><th>操作</th></tr>' +
      gaps.map(g => '<tr><td>'+esc(g.question)+'</td><td>'+esc(g.type)+'</td><td>'+badge(g.status)+'</td><td>'+esc(g.detected_at)+'</td><td>'+esc(g.suggested_action||'')+'</td>' +
        '<td>'+(g.status==='pending' ? '<button class="btn" onclick="viewAction(\'gap:'+esc(g.question)+'\')">详情</button>' : '')+'</td></tr>').join('') + '</table>';
  } else if (view === 'sources') {
    const srcs = await api('/api/sources');
    $main.innerHTML = '<h2>Source（'+srcs.length+'）</h2><table><tr><th>文件</th><th>类型</th><th>大小(KB)</th><th>关联 Wiki</th><th>处理状态</th></tr>' +
      srcs.map(s => '<tr><td>'+esc(s.name)+'</td><td>'+esc(s.type)+'</td><td>'+s.size_kb+'</td><td>'+esc((s.linked_wikis||[]).join('；')||'—')+'</td><td>'+esc(s.processed)+'</td></tr>').join('') + '</table>';
  } else if (view === 'activity') {
    const acts = await api('/api/activity');
    $main.innerHTML = '<h2>操作记录（'+acts.length+'）</h2>' + activityTable(acts);
  } else if (view === 'health') {
    const h = await api('/api/health');
    const col = (ok) => ok ? '#15803d' : '#b91c1c';
    $main.innerHTML = '<h2>系统健康</h2><div class="cards">' +
      '<div class="card"><div class="num" style="color:'+col(h.rag && h.rag.ok)+'">'+(h.rag ? (h.rag.ok?'OK':'ERROR') : '—')+'</div><div class="label">RAG Health</div><div style="font-size:11px;color:#6b7280">'+esc(h.rag ? h.rag.summary : '')+'</div></div>' +
      '<div class="card"><div class="num" style="color:'+col(h.wiki && h.wiki.error === 0)+'">'+(h.wiki ? ('E'+h.wiki.error) : '—')+'</div><div class="label">Wiki Health</div><div style="font-size:11px;color:#6b7280">WARNING='+(h.wiki ? h.wiki.warning : '—')+'</div></div>' +
      '<div class="card"><div class="num" style="color:'+col(h.architecture && h.architecture.ok)+'">'+(h.architecture ? (h.architecture.ok?'OK':'WARN') : '—')+'</div><div class="label">Knowledge OS Check</div><div style="font-size:11px;color:#6b7280">'+esc(h.architecture ? h.architecture.summary : '')+'</div></div>' +
      '</div>';
  }
}
function activityTable(acts) {
  if (!acts || !acts.length) return '<p>暂无记录。</p>';
  return '<table><tr><th>时间</th><th>类型</th><th>目标</th><th>执行者</th><th>AI建议</th><th>用户决定</th><th>结果</th></tr>' +
    acts.map(a => '<tr><td>'+esc(a.time)+'</td><td>'+esc(a.type)+'</td><td>'+esc(a.target)+'</td><td>'+esc(a.actor)+'</td><td>'+esc(a.ai_recommendation)+'</td><td>'+esc(a.user_decision)+'</td><td>'+esc(a.result)+'</td></tr>').join('') + '</table>';
}
async function viewAction(actionId) {
  const a = await api('/api/actions/'+encodeURIComponent(actionId));
  const html = a.type === 'wiki_review' ?
    '<h2>Wiki 详情：'+esc(a.target.title)+'</h2><p><b>路径：</b>'+esc(a.target.wiki)+'　<b>AI 建议：</b>'+esc(a.ai_recommendation)+'</p>' +
    '<details open><summary>来源（Evidence）</summary><pre>'+esc((a.evidence ? a.evidence.source : []).join('\n'))+'</pre></details>' +
    '<div style="margin:8px 0">'+actionButtons(a)+'</div>' :
    '<h2>Gap 详情</h2><p><b>问题：</b>'+esc(a.target.question)+'</p><p><b>类型：</b>'+esc(a.target.type)+'　<b>AI 建议：</b>'+esc(a.ai_recommendation)+'</p>' +
    '<details open><summary>AI 认为它是 Gap 的原因</summary><pre>'+esc(a.reason)+'</pre></details>' +
    '<details><summary>相关 Source</summary><pre>'+esc((a.evidence ? a.evidence.related_sources : []).join('\n'))+'</pre></details>' +
    '<div style="margin:8px 0">'+actionButtons(a)+'</div>';
  $main.innerHTML = html + '<div id="flash"></div>';
  window._flash = (ok, text) => { document.getElementById('flash').innerHTML = msg(ok, text); };
}
function updSel() { document.getElementById('selcount').textContent = document.querySelectorAll('.wsel:checked').length; }
async function batchApprove() {
  const ids = Array.from(document.querySelectorAll('.wsel:checked')).map(x => 'wiki_review:' + x.value);
  if (!ids.length) { alert('未选择任何 Wiki'); return; }
  if (!confirm('确认批准选中的 ' + ids.length + ' 项（draft -> reviewed）？')) return;
  const r = await api('/api/actions/batch/approve', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ids:ids, confirm:true, actor:'user'})});
  alert(r.message || (r.ok ? '完成' : '失败'));
  render('wikis');
}
render('dashboard');
</script>
</body>
</html>
